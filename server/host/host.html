<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WebRTC Demo - Host</title>
  <link rel="stylesheet" href="host.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      color: #333;
      padding: 20px;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }
    .header {
      text-align: center;
      color: white;
      margin-bottom: 30px;
    }
    .header h1 { font-size: 2.5rem; margin-bottom: 8px; }
    .header p { font-size: 1.1rem; opacity: 0.9; }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }
    .panel {
      background: white;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    }
    .panel h2 {
      font-size: 1.5rem;
      margin-bottom: 16px;
      color: #667eea;
    }
    #status {
      display: inline-block;
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: 600;
      margin-bottom: 16px;
      background: #fff3e0;
      color: #e65100;
    }
    #status.connected {
      background: #e8f5e9;
      color: #2e7d32;
    }
    .log {
      background: #f5f5f5;
      border-radius: 8px;
      padding: 12px;
      height: 250px;
      overflow-y: auto;
      font-family: 'Monaco', 'Menlo', monospace;
      font-size: 0.9rem;
      line-height: 1.5;
      border: 2px solid #ddd;
    }
    #log {
      width: 100%;
      height: 100%;
      border: none;
      background: transparent;
      resize: none;
      font-family: inherit;
      font-size: inherit;
    }
    .control-group {
      margin-top: 16px;
    }
    .control-group button {
      width: 100%;
      padding: 12px 14px;
      font-size: 1rem;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .control-group button:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
    }
    .peer-list {
      list-style: none;
      padding: 0;
    }
    .peer-list li {
      padding: 12px 16px;
      background: #f0f0f0;
      border-radius: 6px;
      margin-bottom: 8px;
      font-weight: 500;
    }
    .message-controls {
      display: flex;
      gap: 10px;
      margin-top: 16px;
    }
    .message-controls input {
      flex: 1;
      padding: 12px 14px;
      border: 2px solid #ddd;
      border-radius: 6px;
      font-size: 1rem;
    }
    .message-controls button {
      padding: 12px 24px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .message-controls button:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
    }
    @media (max-width: 768px) {
      .grid { grid-template-columns: 1fr; }
      .header h1 { font-size: 1.8rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🎙️ WebRTC Host</h1>
      <p>Manage connections and broadcast messages</p>
    </div>
    
    <div class="grid">
      <div class="panel">
        <h2>Connection</h2>
        <div id="status">🟡 Disconnected</div>
        
        <div class="control-group">
          <button id="connect" type="button">Connect & Start</button>
        </div>

        <div class="control-group">
          <label class="label-block">Your ID</label>
          <div class="flex-row">
            <span id="myId" class="id-badge">—</span>
            <button id="copyId" type="button">Copy ID</button>
          </div>
        </div>
        
        <div class="control-group">
          <label class="label-block">Encryption (Optional)</label>
          <div class="flex-row mb8">
            <input id="encryptSecret" type="password" placeholder="Enter shared secret..." class="input-bordered" />
            <button id="setEncryptionSecret" type="button" class="btn-small">Set Secret</button>
          </div>
          <div class="flex-row">
            <input id="encryptionToggle" type="checkbox" class="checkbox-lg" />
            <label for="encryptionToggle" class="label-inline-flex">Enable message encryption</label>
            <span id="encryptionStatus" class="encryption-status">OFF</span>
          </div>
        </div>

        <div class="control-group">
          <label class="label-block">Connection Log:</label>
          <div class="log">
            <textarea id="log" readonly placeholder="Connection and messaging log..."></textarea>
          </div>
        </div>
      </div>
      
        <div class="panel">
        <h2>Connected Peers</h2>
        <div class="header-row">
          <h3 class="no-margin">Known Members</h3>
          <button id="refreshMembers" type="button" class="small-btn">🔄 Refresh</button>
        </div>
        <ul id="membersList" class="peer-list">
          <li class="muted">No members yet</li>
        </ul>

        <h3 class="mt12">Active Connections</h3>
        <ul id="peerList" class="peer-list">
          <li class="muted">Waiting for connections...</li>
        </ul>
        
        <div class="message-controls">
          <input id="msg" type="text" placeholder="Message to broadcast..." />
          <button id="send" type="button">Send</button>
        </div>
      </div>
    </div>
  </div>
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <div id="debugBanner">Initializing...</div>
  <script>
    (function(){
      const banner = document.getElementById('debugBanner')
      function update() {
        const sup = !!window.supabase
        banner.textContent = `Supabase: ${sup ? 'loaded' : 'missing'} | App script: pending`
        if (sup) {
          clearInterval(iv)
        }
      }
      const iv = setInterval(update, 300)
      update()
      window.addEventListener('load', () => {
        banner.textContent = banner.textContent.replace('pending','loaded (page)')
      })
    })()
  </script>
  <script src="host.js"></script>
</body>
</html>
